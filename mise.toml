[tasks."repo:apply"]
description = "Apply GitHub repo configuration from .github/config"
run = '''
set -euo pipefail

gh repo-config apply

# Workflow permissions, which the extension does not manage: it covers repo.json and topics.json,
# and nothing under Actions. Applied here so settings live in files and are applied by this task,
# never clicked in the UI.
#
# `can_approve_pull_request_reviews` is what dependabot-automerge.yml needs: an approval by
# GITHUB_TOKEN is refused otherwise, whatever `permissions` the job asks for.
# `default_workflow_permissions` stays `read`; a workflow that needs more says so itself.
gh api --method PUT repos/{owner}/{repo}/actions/permissions/workflow \
  --input .github/config/actions-permissions.json
'''
