server {
    listen 80;
    server_name _;

    # Episode redirects: /YYYY/MM/episode-NNN.html -> /ep-NNN
    location ~ "^/\d{4}/\d{2}/episode-(\d+)\.html$" {
        return 301 https://razborpoletov.mave.digital/ep-$1;
    }

    # RSS/Atom feed redirects
    location = /itunes.xml {
        return 301 https://cloud.mave.digital/69770;
    }

    location = /rss_full.xml {
        return 301 https://cloud.mave.digital/69770;
    }

    location = /atom_full.xml {
        return 301 https://cloud.mave.digital/69770;
    }

    location = /atom.xml {
        return 301 https://cloud.mave.digital/69770;
    }

    # Everything else -> main page
    location / {
        return 301 https://razborpoletov.mave.digital/;
    }
}
